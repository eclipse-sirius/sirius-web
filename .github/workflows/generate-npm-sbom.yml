name: Generate NPM SBOM

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        default: "master"
        required: true

env:
  NODE_VERSION: "24.20"
  REGISTRY_URL: "https://npm.pkg.github.com/"
  PRODUCT_PATH: "./"
  GITHUB_REF: ${{ github.ref }}
  INPUTS_VERSION: ${{ inputs.version }}

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate SBOM for frontend
    runs-on: ubuntu-latest
    permissions:
      packages: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.INPUTS_VERSION }}
          persist-credentials: false

      - name: Setup Node SDK
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}

      - name: Install dependencies
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc
          echo "CI=true" >> $GITHUB_ENV
          npm ci

      - name: Install cyclonedx-npm
        run: |
          npm install --global @cyclonedx/cyclonedx-npm@4.2.1

      - name: Generate runtime SBOM
        run: |
          cyclonedx-npm --output-format json --output-file runtime-bom.json --omit dev

      - name: Generate full SBOM
        run: |
          cyclonedx-npm --output-format json --output-file full-bom.json

      - name: Extract product version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -r '.metadata.component.version' < ./${{ env.PRODUCT_PATH }}/runtime-bom.json)"

          # Only a v* release tag yields a clean version, anything else is a
          # development snapshot. A called run builds GITHUB_REF, a manual run
          # builds the ref it was given.
          BUILT_REF="${INPUTS_VERSION:-$GITHUB_REF}"
          if [[ ! "$BUILT_REF" =~ ^(refs/tags/)?v ]]; then
            VERSION="${VERSION}@dev"
          fi

          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Product version: $VERSION"

      - name: Upload runtime SBOM
        uses: eclipse-csi/workflows/upload-sbom@d2d3dbbc0a1907f41892c1698b3c6353235c87cb # upload-sbom/v1.0.0
        with:
          sbom-file: ${{ env.PRODUCT_PATH }}/runtime-bom.json
          product-name: "Sirius Web - Frontend Runtime"
          product-version: ${{ steps.version.outputs.PROJECT_VERSION }}

      - name: Upload full SBOM
        uses: eclipse-csi/workflows/upload-sbom@d2d3dbbc0a1907f41892c1698b3c6353235c87cb # upload-sbom/v1.0.0
        with:
          sbom-file: ${{ env.PRODUCT_PATH }}/full-bom.json
          product-name: "Sirius Web - Frontend Full"
          product-version: ${{ steps.version.outputs.PROJECT_VERSION }}

      # Consumed by the `combined-sbom` job of the calling workflow
      - name: Store runtime SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-sbom
          path: ${{ env.PRODUCT_PATH }}/runtime-bom.json
          retention-days: 5
